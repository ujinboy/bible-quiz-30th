<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>골든벨 모드 - 제30차 성경잔치</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f0eb;
  color: #2c2c2c;
  line-height: 1.7;
  padding: 20px;
  max-width: 720px;
  margin: 0 auto;
}
header {
  text-align: center;
  padding: 30px 0 20px;
  border-bottom: 2px solid #8b6914;
  margin-bottom: 24px;
}
header h1 { font-size: 1.5em; color: #8b6914; }
header p { font-size: 0.85em; color: #666; margin-top: 4px; }

.setup-box {
  background: #fff;
  border-radius: 10px;
  padding: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  text-align: center;
  margin-bottom: 24px;
}
.setup-box h2 { font-size: 1.1em; color: #5a4a2a; margin-bottom: 16px; }
.setup-options { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
.setup-btn {
  padding: 10px 20px;
  background: #fff;
  border: 2px solid #e0d6c4;
  border-radius: 8px;
  font-size: 0.95em;
  cursor: pointer;
  transition: all 0.15s;
}
.setup-btn:hover { border-color: #8b6914; background: #f9f4ec; }
.setup-btn.selected { border-color: #8b6914; background: #8b6914; color: #fff; }

.gospel-filter { margin: 12px 0; }
.gospel-filter label { font-size: 0.85em; margin-right: 12px; cursor: pointer; }
.gospel-filter input { margin-right: 3px; }

.start-btn {
  padding: 12px 36px;
  background: #8b6914;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1.05em;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}
.start-btn:hover { background: #6d5310; }

/* Quiz area */
.quiz-area { display: none; }
.progress-bar {
  background: #e0d6c4;
  border-radius: 20px;
  height: 8px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  background: #8b6914;
  height: 100%;
  width: 0%;
  transition: width 0.3s;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  font-size: 0.82em;
  color: #666;
  margin-bottom: 16px;
}
.question-card {
  background: #fff;
  border-radius: 10px;
  padding: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  margin-bottom: 20px;
}
.q-meta { font-size: 0.78em; color: #888; margin-bottom: 10px; }
.q-meta .gospel-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  color: #fff;
  font-size: 0.85em;
  margin-right: 6px;
}
.gospel-mt { background: #5c7cba; }
.gospel-mk { background: #7b5ea7; }
.gospel-lk { background: #4a9e6f; }
.gospel-jn { background: #c97a2e; }

.q-text { font-size: 1.05em; font-weight: 600; margin-bottom: 14px; color: #1a1a1a; }
.q-passage {
  background: #fdf8f3;
  border-left: 3px solid #e8b580;
  padding: 12px 16px;
  margin-bottom: 14px;
  font-size: 0.92em;
  color: #444;
  border-radius: 0 6px 6px 0;
}
.options-list { list-style: none; margin-bottom: 16px; }
.options-list li {
  padding: 12px 16px;
  margin-bottom: 8px;
  border-radius: 8px;
  font-size: 0.95em;
  background: #fafafa;
  border: 2px solid #e0d6c4;
  cursor: pointer;
  transition: all 0.15s;
}
.options-list li:hover { background: #f8f0e5; border-color: #c0a060; }
.options-list li.selected { background: #e3f2fd; border-color: #42a5f5; }
.options-list li.correct { background: #e8f5e9; border-color: #4caf50; font-weight: 600; }
.options-list li.wrong { background: #ffebee; border-color: #e57373; }
.options-list li.disabled { pointer-events: none; opacity: 0.7; }

.ox-buttons { display: flex; gap: 16px; justify-content: center; margin-bottom: 16px; }
.ox-btn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid #e0d6c4;
  background: #fff;
  font-size: 2em;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ox-btn:hover { border-color: #8b6914; background: #f9f4ec; }
.ox-btn.selected { border-color: #42a5f5; background: #e3f2fd; }
.ox-btn.correct { border-color: #4caf50; background: #e8f5e9; }
.ox-btn.wrong { border-color: #e57373; background: #ffebee; }

.submit-btn {
  display: block;
  width: 100%;
  padding: 12px;
  background: #8b6914;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
}
.submit-btn:hover { background: #6d5310; }
.submit-btn:disabled { background: #ccc; cursor: not-allowed; }

.feedback {
  text-align: center;
  padding: 16px;
  border-radius: 8px;
  margin-top: 16px;
  font-weight: 600;
  display: none;
}
.feedback.correct { display: block; background: #e8f5e9; color: #2e7d32; }
.feedback.wrong { display: block; background: #ffebee; color: #c62828; }

.next-btn {
  display: none;
  width: 100%;
  padding: 12px;
  background: #5c7cba;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
}
.next-btn:hover { background: #4a6aa0; }

/* Result */
.result-area { display: none; text-align: center; }
.result-area h2 { font-size: 1.4em; color: #8b6914; margin-bottom: 16px; }
.result-score {
  font-size: 3em;
  font-weight: bold;
  color: #8b6914;
  margin: 20px 0;
}
.result-detail { font-size: 0.95em; color: #555; margin-bottom: 20px; }
.result-best { font-size: 0.85em; color: #888; margin-bottom: 20px; }
.retry-btn {
  padding: 12px 36px;
  background: #8b6914;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1.05em;
  font-weight: 600;
  cursor: pointer;
}
.retry-btn:hover { background: #6d5310; }
.home-btn {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 24px;
  background: #fff;
  border: 2px solid #8b6914;
  color: #8b6914;
  border-radius: 8px;
  font-size: 0.95em;
  text-decoration: none;
  cursor: pointer;
}
.home-btn:hover { background: #f9f4ec; }

footer {
  text-align: center;
  padding: 20px 0;
  color: #999;
  font-size: 0.8em;
  border-top: 1px solid #ddd;
  margin-top: 30px;
}
</style>
</head>
<body>

<header>
  <h1>골든벨 모드</h1>
  <p>틀리면 탈락! 연속 정답에 도전하세요.</p>
</header>

<!-- Setup -->
<div class="setup-box" id="setup">
  <h2>문제 수 선택</h2>
  <div class="setup-options" id="count-options">
    <button class="setup-btn" data-count="10">10문제</button>
    <button class="setup-btn selected" data-count="20">20문제</button>
    <button class="setup-btn" data-count="30">30문제</button>
    <button class="setup-btn" data-count="0">전체</button>
  </div>
  <div class="gospel-filter">
    <label><input type="checkbox" value="마태오" checked> 마태오</label>
    <label><input type="checkbox" value="마르코" checked> 마르코</label>
    <label><input type="checkbox" value="루카" checked> 루카</label>
    <label><input type="checkbox" value="요한" checked> 요한</label>
  </div>
  <button class="start-btn" onclick="startQuiz()">시작</button>
</div>

<!-- Quiz -->
<div class="quiz-area" id="quiz-area">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="status-bar">
    <span id="status-current">1 / 20</span>
    <span id="status-streak">연속 정답: 0</span>
  </div>
  <div class="question-card" id="question-card"></div>
  <button class="submit-btn" id="submit-btn" onclick="submitAnswer()" disabled>확인</button>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 문제</button>
</div>

<!-- Result -->
<div class="result-area" id="result-area">
  <h2 id="result-title">탈락!</h2>
  <div class="result-score" id="result-score">0</div>
  <div class="result-detail" id="result-detail"></div>
  <div class="result-best" id="result-best"></div>
  <button class="retry-btn" onclick="resetQuiz()">다시 도전</button>
  <br>
  <a class="home-btn" href="main.html">처음으로</a>
</div>

<footer>
  <a href="main.html" style="color:#8b6914; text-decoration:none;">처음으로 돌아가기</a>
</footer>

<script>
var allQuestions = [];
var quizQuestions = [];
var currentIndex = 0;
var score = 0;
var selectedAnswer = null;
var answered = false;
var totalCount = 20;

// Load questions
fetch('questions.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    // Filter usable types only
    allQuestions = data.filter(function(q) {
      return q.type === 'single' || q.type === 'multi' || q.type === 'ox';
    });
  });

// Setup: count selection
document.querySelectorAll('.setup-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.setup-btn').forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
  });
});

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function startQuiz() {
  // Get selected count
  var selectedBtn = document.querySelector('.setup-btn.selected');
  totalCount = parseInt(selectedBtn.dataset.count);

  // Get selected gospels
  var gospels = [];
  document.querySelectorAll('.gospel-filter input:checked').forEach(function(cb) {
    gospels.push(cb.value);
  });

  if (gospels.length === 0) {
    alert('복음서를 하나 이상 선택하세요.');
    return;
  }

  // Filter by gospel
  var pool = allQuestions.filter(function(q) { return gospels.indexOf(q.gospel) !== -1; });

  if (pool.length === 0) {
    alert('선택한 범위에 문제가 없습니다.');
    return;
  }

  // Shuffle and pick
  shuffle(pool);
  if (totalCount === 0) totalCount = pool.length;
  quizQuestions = pool.slice(0, Math.min(totalCount, pool.length));
  totalCount = quizQuestions.length;

  currentIndex = 0;
  score = 0;
  answered = false;

  document.getElementById('setup').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';

  showQuestion();
}

function getGospelClass(gospel) {
  if (gospel === '마태오') return 'gospel-mt';
  if (gospel === '마르코') return 'gospel-mk';
  if (gospel === '루카') return 'gospel-lk';
  if (gospel === '요한') return 'gospel-jn';
  return '';
}

function showQuestion() {
  var q = quizQuestions[currentIndex];
  var card = document.getElementById('question-card');

  // Update status
  document.getElementById('status-current').textContent = (currentIndex + 1) + ' / ' + totalCount;
  document.getElementById('status-streak').textContent = '연속 정답: ' + score;
  document.getElementById('progress-fill').style.width = ((currentIndex / totalCount) * 100) + '%';

  // Build question HTML
  var html = '';
  html += '<div class="q-meta"><span class="gospel-tag ' + getGospelClass(q.gospel) + '">' + q.gospel + '</span>';
  html += '<span>' + q.ref + '</span></div>';
  html += '<div class="q-text">' + q.text + '</div>';

  if (q.passage) {
    html += '<div class="q-passage">' + q.passage + '</div>';
  }

  if (q.type === 'ox') {
    html += '<div class="ox-buttons">';
    html += '<div class="ox-btn" data-value="O" onclick="selectOX(this)">O</div>';
    html += '<div class="ox-btn" data-value="X" onclick="selectOX(this)">X</div>';
    html += '</div>';
  } else {
    html += '<ul class="options-list">';
    for (var i = 0; i < q.options.length; i++) {
      html += '<li data-idx="' + i + '" onclick="selectOption(this)">' + q.options[i].text + '</li>';
    }
    html += '</ul>';
    if (q.type === 'multi') {
      html += '<p style="font-size:0.8em;color:#888;margin-top:-10px;margin-bottom:10px;">* 복수 선택 가능</p>';
    }
  }

  card.innerHTML = html;

  // Reset state
  selectedAnswer = null;
  answered = false;
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-btn').style.display = 'block';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
}

function selectOption(li) {
  if (answered) return;
  var q = quizQuestions[currentIndex];

  if (q.type === 'multi') {
    li.classList.toggle('selected');
    // Check if at least one selected
    var selected = document.querySelectorAll('.options-list li.selected');
    document.getElementById('submit-btn').disabled = selected.length === 0;
  } else {
    document.querySelectorAll('.options-list li').forEach(function(l) { l.classList.remove('selected'); });
    li.classList.add('selected');
    document.getElementById('submit-btn').disabled = false;
  }
}

function selectOX(btn) {
  if (answered) return;
  document.querySelectorAll('.ox-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  selectedAnswer = btn.dataset.value;
  document.getElementById('submit-btn').disabled = false;
}

function submitAnswer() {
  if (answered) return;
  answered = true;

  var q = quizQuestions[currentIndex];
  var isCorrect = false;

  if (q.type === 'ox') {
    isCorrect = selectedAnswer === q.correct_ox;
    document.querySelectorAll('.ox-btn').forEach(function(btn) {
      if (btn.dataset.value === q.correct_ox) btn.classList.add('correct');
      else if (btn.classList.contains('selected')) btn.classList.add('wrong');
    });
  } else if (q.type === 'single') {
    var items = document.querySelectorAll('.options-list li');
    var selectedIdx = -1;
    items.forEach(function(li, idx) {
      if (li.classList.contains('selected')) selectedIdx = idx;
    });
    isCorrect = q.options[selectedIdx] && q.options[selectedIdx].correct;
    items.forEach(function(li, idx) {
      li.classList.add('disabled');
      if (q.options[idx].correct) li.classList.add('correct');
      else if (li.classList.contains('selected')) li.classList.add('wrong');
    });
  } else if (q.type === 'multi') {
    var items = document.querySelectorAll('.options-list li');
    var allCorrect = true;
    items.forEach(function(li, idx) {
      var isSelected = li.classList.contains('selected');
      var shouldBeSelected = q.options[idx].correct;
      if (isSelected !== shouldBeSelected) allCorrect = false;
      li.classList.add('disabled');
      if (shouldBeSelected) li.classList.add('correct');
      else if (isSelected) li.classList.add('wrong');
    });
    isCorrect = allCorrect;
  }

  document.getElementById('submit-btn').style.display = 'none';

  var feedback = document.getElementById('feedback');
  if (isCorrect) {
    score++;
    feedback.className = 'feedback correct';
    feedback.textContent = '정답! (' + score + '문제 연속 정답)';
    document.getElementById('status-streak').textContent = '연속 정답: ' + score;
    document.getElementById('next-btn').style.display = 'block';
  } else {
    feedback.className = 'feedback wrong';
    feedback.textContent = '탈락! ' + score + '문제 연속 정답으로 종료됩니다.';
    setTimeout(showResult, 1500);
  }
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= totalCount) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';

  var perfect = score === totalCount;
  document.getElementById('result-title').textContent = perfect ? '축하합니다! 전문 통과!' : '탈락!';
  document.getElementById('result-score').textContent = score + '문제';
  document.getElementById('result-detail').textContent = totalCount + '문제 중 ' + score + '문제 연속 정답';

  // Save best score
  var bestKey = 'goldenbell_best';
  var best = parseInt(localStorage.getItem(bestKey) || '0');
  if (score > best) {
    best = score;
    localStorage.setItem(bestKey, best.toString());
  }
  document.getElementById('result-best').textContent = '최고 기록: ' + best + '문제';

  // Update progress
  document.getElementById('progress-fill').style.width = '100%';
}

function resetQuiz() {
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
}
</script>
</body>
</html>
