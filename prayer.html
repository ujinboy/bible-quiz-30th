<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경을 읽기 전에 / 읽고 나서</title>
<meta property="og:title" content="성경을 읽기 전에 / 읽고 나서">
<meta property="og:description" content="제30차 성경잔치 기도문">
<meta property="og:image" content="https://ujinboy.github.io/bible-quiz-30th/images/2.jpg">
<meta property="og:url" content="https://ujinboy.github.io/bible-quiz-30th/prayer.html">
<meta property="og:type" content="website">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f0eb;
  color: #2c2c2c;
  line-height: 1.9;
  padding: 20px;
  max-width: 800px;
  margin: 0 auto;
}
header {
  text-align: center;
  padding: 30px 0 20px;
  border-bottom: 2px solid #8b6914;
  margin-bottom: 30px;
}
header h1 {
  font-size: 1.4em;
  color: #8b6914;
  margin-bottom: 5px;
}
.prayer-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 30px;
}
@media (max-width: 600px) {
  .prayer-container {
    grid-template-columns: 1fr;
  }
}
.prayer-section {
  background: #fff;
  border-radius: 12px;
  padding: 24px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.prayer-section h2 {
  font-size: 1.1em;
  color: #8b6914;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid #e8d9b8;
  text-align: center;
}
.scripture {
  font-style: italic;
  color: #555;
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid #d4b96a;
  font-size: 0.92em;
}
.scripture .ref {
  display: block;
  font-size: 0.85em;
  color: #888;
  margin-top: 4px;
  font-style: normal;
}
.prayer-text {
  font-size: 0.95em;
  color: #333;
}
.prayer-text .amen {
  display: block;
  margin-top: 12px;
  font-weight: 600;
  color: #8b6914;
}
.nav-bottom {
  text-align: center;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid #ddd;
}
.nav-bottom a {
  display: inline-block;
  padding: 10px 24px;
  background: #8b6914;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-size: 0.9em;
  transition: background 0.15s;
}
.nav-bottom a:hover {
  background: #6d5310;
}
</style>
</head>
<body>

<header>
  <h1>기도문</h1>
</header>

<div class="prayer-container">
  <div class="prayer-section">
    <h2>성경을 읽기 전에</h2>
    <div class="scripture">
      말씀은 너희에게 가까이 있다.<br>
      너희 입과 너희 마음에 있다.
      <span class="ref">(로마 10,8)</span>
    </div>
    <div class="prayer-text">
      주님,<br>
      성령의 빛으로 저희 눈을 여시어<br>
      주님의 길을 보게 하시고<br>
      저희 귀를 여시어<br>
      생명의 말씀을 듣게 하소서.
      <span class="amen">아멘.</span>
    </div>
  </div>

  <div class="prayer-section">
    <h2>성경을 읽고 나서</h2>
    <div class="scripture">
      당신 말씀은 제 발에 등불,<br>
      저의 길에 빛입니다.
      <span class="ref">(시편 119,105)</span>
    </div>
    <div class="prayer-text">
      주님,<br>
      저희가 성경을 생명의 말씀으로<br>
      믿고 기도하며<br>
      살고 선포하게 하시어<br>
      언제나 성령 안에서<br>
      평화와 기쁨을 누리게 하소서.
      <span class="amen">아멘.</span>
    </div>
  </div>
</div>

<div class="nav-bottom">
  <a href="main.html">목차로 돌아가기</a>
</div>

</body>
</html>
